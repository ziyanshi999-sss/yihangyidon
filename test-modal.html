<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新弹窗设计预览</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .preview-container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .preview-header {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .preview-content {
            padding: 20px;
        }
        .feature-list {
            list-style: none;
            padding: 0;
        }
        .feature-list li {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .feature-list li:last-child {
            border-bottom: none;
        }
        .feature-icon {
            display: inline-block;
            width: 20px;
            text-align: center;
            margin-right: 10px;
        }
        .demo-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        .demo-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="preview-header">
            <h2>🎉 全新申购弹窗设计</h2>
            <p>现代化、用户友好的理财产品申购界面</p>
        </div>
        <div class="preview-content">
            <h3>✨ 新功能特性</h3>
            <ul class="feature-list">
                <li><span class="feature-icon">🎨</span> 现代化渐变设计</li>
                <li><span class="feature-icon">📱</span> 移动端优化布局</li>
                <li><span class="feature-icon">💰</span> 产品信息卡片展示</li>
                <li><span class="feature-icon">🔢</span> 智能金额建议</li>
                <li><span class="feature-icon">📊</span> 实时收益预览</li>
                <li><span class="feature-icon">✅</span> 优化的协议确认</li>
                <li><span class="feature-icon">🎯</span> 更好的交互反馈</li>
                <li><span class="feature-icon">⚡</span> 流畅的动画效果</li>
            </ul>
            
            <button class="demo-button" onclick="showDemo()">
                查看实际效果
            </button>
        </div>
    </div>

    <script>
        function showDemo() {
            alert('请访问 http://localhost:5173 查看实际的弹窗效果！\n\n在理财产品页面点击"立即申购"按钮即可看到全新的弹窗设计。');
        }
    </script>
</body>
</html>
